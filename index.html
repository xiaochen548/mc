<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>痕域 · 角色配置台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%2313161b'/%3E%3Cpath d='M9 7h4l3 9 3-9h4l-5 14h-4z' fill='%23b87c46'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0c0e11; --panel:#12151a; --panel2:#171b21; --panel3:#1d222a;
  --line:#282f39; --line2:#343d49;
  --txt:#e3e6ea; --dim:#8b939d; --dim2:#69727d;
  --acc:#b87c46; --acc-l:#d59a63; --acc2:#6f9b93;
  --warn:#c6a052; --err:#c4675a; --ok:#7ea88a;
  --mono:ui-monospace,SFMono-Regular,"JetBrains Mono",Menlo,Consolas,"Courier New",monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
svg{width:14px;height:14px;flex:none;display:inline-block;vertical-align:-2px}
body{
  margin:0;background:var(--bg);color:var(--txt);
  font:14px/1.55 system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;height:100vh;overflow:hidden;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
::selection{background:rgba(184,124,70,.35)}

/* ---------- header ---------- */
header{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:18px;flex:none;
  padding:11px 18px;border-bottom:1px solid var(--line);
  background:rgba(12,14,17,.94);backdrop-filter:blur(10px);
}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.mark{width:30px;height:30px;flex:none;display:grid;place-items:center;border:1px solid var(--line2);background:var(--panel2)}
.mark svg{width:16px;height:16px;display:block}
.brand h1{margin:0;font-size:15px;font-weight:650;letter-spacing:.06em;white-space:nowrap}
.brand p{margin:1px 0 0;font-size:11px;color:var(--dim2);letter-spacing:.08em;white-space:nowrap}
.hdr-tools{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.proj{display:flex;align-items:center;gap:7px;padding-right:6px;margin-right:2px;border-right:1px solid var(--line)}
.proj span{font-size:11px;color:var(--dim2);white-space:nowrap}
.proj input{width:120px;padding:5px 8px;background:var(--panel2);border:1px solid var(--line);border-radius:3px;font-size:12px}
.proj input:focus{outline:none;border-color:var(--acc)}

.btn{
  display:inline-flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap;
  padding:7px 13px;border:1px solid var(--line2);border-radius:3px;
  background:var(--panel2);color:var(--txt);font-size:12.5px;letter-spacing:.03em;
  transition:background .15s,border-color .15s,color .15s;
}
.btn:hover{background:var(--panel3);border-color:#46505e}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#15100a;font-weight:650}
.btn.primary:hover{background:var(--acc-l);border-color:var(--acc-l)}
.btn.mini{padding:4px 9px;font-size:11.5px;border-radius:2px}
.btn.link{padding:0;border:0;background:none;color:var(--acc-l);font-size:12px}
.btn.link:hover{text-decoration:underline;background:none}
.btn svg{width:13px;height:13px;flex:none}

/* ---------- layout ---------- */
.work{display:grid;grid-template-columns:238px minmax(0,1fr) 404px;flex:1;min-height:0}
nav{overflow-y:auto;border-right:1px solid var(--line);background:var(--panel);padding:14px 10px 40px}
main{overflow-y:auto;padding:22px 26px 80px}
aside{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line);background:var(--panel)}

/* ---------- nav ---------- */
.nav-t{display:flex;align-items:center;justify-content:space-between;padding:0 8px 8px;font-size:11px;letter-spacing:.14em;color:var(--dim2)}
.nav-new{padding:0 8px 12px}
.nav-new .btn{width:100%;justify-content:center}
.chip{
  display:flex;align-items:flex-start;gap:9px;width:100%;text-align:left;cursor:pointer;
  padding:8px 9px;margin-bottom:3px;border:1px solid transparent;border-left:2px solid transparent;
  border-radius:2px;background:none;
}
.chip:hover{background:var(--panel2)}
.chip.on{background:var(--panel2);border-color:var(--line);border-left-color:var(--acc)}
.chip .dot{width:6px;height:6px;margin-top:6px;flex:none;background:var(--dim2);border-radius:50%}
.chip.on .dot{background:var(--acc)}
.chip .ct{min-width:0;flex:1}
.chip .cn{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .cm{display:block;margin-top:2px;font:10.5px/1.4 var(--mono);color:var(--dim2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-sep{height:1px;margin:14px 8px 12px;background:var(--line)}
.nav-item{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;cursor:pointer;
  padding:7px 9px;border-radius:2px;background:none;border:1px solid transparent;color:var(--dim);font-size:12.5px;
}
.nav-item:hover{background:var(--panel2);color:var(--txt)}
.nav-item.on{background:var(--panel2);border-color:var(--line);color:var(--txt)}
.nav-item.on .ni-i{color:var(--acc)}
.nav-item .ni-i{color:var(--dim2);display:flex;flex:none}
.nav-item svg{width:14px;height:14px}
.nav-item .kbd{margin-left:auto;font:10px var(--mono);color:var(--dim2)}

/* ---------- main content ---------- */
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.vh h2{margin:0;font-size:19px;font-weight:650;letter-spacing:.02em}
.vh p{margin:4px 0 0;font-size:12px;color:var(--dim)}
.vh .act{display:flex;gap:8px;flex:none}
.sec{border:1px solid var(--line);background:var(--panel);margin-bottom:16px;border-radius:2px}
.sec-hd{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel2)}
.sec-hd .idx{font:11px var(--mono);color:var(--acc);letter-spacing:.1em}
.sec-hd h3{margin:0;font-size:13px;font-weight:600;letter-spacing:.04em}
.sec-hd .hint{margin-left:auto;font-size:11px;color:var(--dim2);text-align:right}
.sec-bd{padding:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px 16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px 16px}
.full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label{font-size:11.5px;color:var(--dim);letter-spacing:.04em;display:flex;align-items:center;gap:6px}
.fld label .rq{color:var(--acc);font-size:11px}
.fld label .ty{margin-left:auto;font:10px var(--mono);color:var(--dim2)}
.fld input[type=text],.fld input[type=number],.fld select,.fld textarea{
  width:100%;padding:7px 10px;background:var(--panel2);border:1px solid var(--line);
  border-radius:2px;font-size:13px;transition:border-color .15s,background .15s;
}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--acc);background:#191e25}
.fld textarea{resize:vertical;min-height:64px;line-height:1.6}
.fld input[type=number]{font-family:var(--mono)}
.fld .fh{font-size:10.5px;color:var(--dim2);font-family:var(--mono)}
.fld.bad input,.fld.bad select{border-color:var(--err)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);background-position:calc(100% - 15px) 14px,calc(100% - 10px) 14px;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px!important}
.switch{display:flex;align-items:center;gap:9px;cursor:pointer;font-size:12px;color:var(--dim)}
.switch input{width:0;height:0;position:absolute;opacity:0}
.switch .track{width:32px;height:17px;flex:none;border:1px solid var(--line2);background:var(--panel3);border-radius:9px;position:relative;transition:.15s}
.switch .track::after{content:"";position:absolute;left:2px;top:2px;width:11px;height:11px;background:var(--dim);border-radius:50%;transition:.15s}
.switch input:checked + .track{background:rgba(184,124,70,.2);border-color:var(--acc)}
.switch input:checked + .track::after{left:17px;background:var(--acc-l)}
.switch input:checked ~ .lb{color:var(--txt)}
.note{padding:9px 12px;border-left:2px solid var(--line2);background:var(--panel2);font-size:11.5px;color:var(--dim);line-height:1.7}
.note.w{border-left-color:var(--warn)}
.note.e{border-left-color:var(--err)}
.note strong{color:var(--txt);font-weight:600}

/* skill slot */
.slot{border:1px solid var(--line);background:var(--panel);margin-bottom:12px}
.slot-hd{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--panel2);border-bottom:1px solid var(--line);cursor:pointer;user-select:none}
.slot-hd .nm{font-size:12.5px;font-weight:600;letter-spacing:.04em}
.slot-hd .fl{font:10.5px var(--mono);color:var(--dim2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot-hd .chev{margin-left:auto;color:var(--dim2);transition:.2s}
.slot.closed .chev{transform:rotate(-90deg)}
.slot.closed .slot-bd{display:none}
.slot-bd{padding:12px}
.refbox{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px}
.ref{display:flex;flex-direction:column;gap:3px;padding:7px 9px;border:1px solid var(--line);background:var(--panel2);min-width:0}
.ref .rl{font-size:11px;color:var(--dim)}
.ref .rp{font:10.5px/1.5 var(--mono);color:var(--acc2);word-break:break-all}

/* ---------- aside ---------- */
.as-hd{display:flex;align-items:center;gap:9px;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--panel2);font-size:11.5px;letter-spacing:.1em;color:var(--dim)}
.as-hd .cnt{margin-left:auto;font:10px var(--mono);color:var(--dim2)}
.val{border-bottom:1px solid var(--line);max-height:200px;overflow-y:auto;padding:9px 12px;flex:none}
.val.ok{color:var(--ok);font-size:11.5px;display:flex;gap:7px;align-items:center}
.vitem{display:flex;gap:7px;font-size:11.5px;line-height:1.55;margin-bottom:5px;align-items:flex-start}
.vitem .dm{width:5px;height:5px;flex:none;margin-top:6px;border-radius:50%}
.vitem.err .dm{background:var(--err)} .vitem.err .vt{color:#dd9b90}
.vitem.warn .dm{background:var(--warn)} .vitem.warn .vt{color:#cdb681}
.vitem .vt{min-width:0}
.tree{flex:none;max-height:236px;overflow-y:auto;padding:8px 6px;border-bottom:1px solid var(--line)}
.tnode{display:flex;align-items:center;gap:7px;padding:5px 8px;cursor:pointer;font-size:11.5px;color:var(--dim);border-radius:2px}
.tnode:hover{background:var(--panel2);color:var(--txt)}
.tnode.on{background:var(--panel2);color:var(--txt);box-shadow:inset 2px 0 0 var(--acc)}
.tnode .ti{flex:none;color:var(--dim2);display:flex}
.tnode svg{width:12px;height:12px}
.tnode .tp{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tnode .ts{margin-left:auto;font:10px var(--mono);color:var(--dim2);flex:none}
.tgroup{padding:6px 8px 3px;font:10px var(--mono);color:var(--dim2);letter-spacing:.06em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prev-hd{display:flex;align-items:center;gap:8px;padding:7px 12px;font:10.5px var(--mono);color:var(--acc2);border-bottom:1px solid var(--line);min-height:32px}
.prev-hd .pn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prev-hd .btn{margin-left:auto}
.code{
  margin:0;flex:1;overflow:auto;padding:12px 14px;font:11.5px/1.65 var(--mono);
  color:#c9d1d9;white-space:pre-wrap;word-break:break-word;tab-size:2;background:#0a0c0e;
}
.code .k{color:var(--acc-l)} .code .s{color:#9db98c} .code .c{color:#5f6b78} .code .n{color:#c9a78b}

/* ---------- schema tables ---------- */
.tbl{width:100%;border-collapse:collapse;table-layout:fixed;font-size:12px}
.tbl th{text-align:left;font-weight:500;font-size:11px;color:var(--dim2);letter-spacing:.06em;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:4px 8px;border-bottom:1px solid rgba(40,47,57,.6);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl input[type=text],.tbl select{width:100%;padding:5px 8px;background:var(--panel2);border:1px solid var(--line);border-radius:2px;font-size:12px}
.tbl input[type=text]:focus,.tbl select:focus{outline:none;border-color:var(--acc)}
.tbl .lb{color:var(--dim);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl .mono{font-family:var(--mono);font-size:11px}
details.grp{border:1px solid var(--line);margin-bottom:10px;background:var(--panel)}
details.grp[open] .sum{border-bottom:1px solid var(--line)}
.sum{display:flex;align-items:center;gap:9px;padding:9px 12px;cursor:pointer;font-size:12.5px;font-weight:600;letter-spacing:.03em;background:var(--panel2);list-style:none}
.sum::-webkit-details-marker{display:none}
.sum .tag{margin-left:auto;font:10px var(--mono);color:var(--dim2);font-weight:400}
.sum .ar{color:var(--dim2);font-size:10px}
details.grp .tbl{padding:0}
.tbl-wrap{padding:6px 8px 8px}
textarea.big{width:100%;min-height:150px;padding:10px;background:#0a0c0e;border:1px solid var(--line);border-radius:2px;font:11.5px/1.6 var(--mono);resize:vertical}
textarea.big:focus{outline:none;border-color:var(--acc)}
.mono-sm{font:11px/1.6 var(--mono);color:var(--dim)}
.help h4{margin:18px 0 6px;font-size:12px;color:var(--acc-l);letter-spacing:.05em}
.help p,.help li{font-size:12.5px;color:var(--dim);line-height:1.8}
.help li{margin-bottom:3px}
.help code{font:11.5px var(--mono);color:var(--acc2);background:var(--panel2);padding:1px 4px;border-radius:2px}
.help ol{padding-left:20px;margin:6px 0}

@media (max-width:1240px){
  .work{grid-template-columns:210px minmax(0,1fr) 340px}
  main{padding:18px}
}
@media (max-width:1000px){
  .work{grid-template-columns:minmax(0,1fr)}
  nav{display:block;position:fixed;top:0;bottom:0;left:0;width:min(292px,88vw);z-index:50;
    transform:translateX(-101%);transition:transform .25s;box-shadow:12px 0 30px rgba(0,0,0,.5);padding-top:14px}
  body.show-nav nav{transform:none}
  aside{position:fixed;top:0;bottom:0;right:0;width:min(430px,94vw);z-index:50;transform:translateX(101%);transition:transform .25s;box-shadow:-12px 0 30px rgba(0,0,0,.5)}
  body.show-aside aside{transform:none}
  #scrim{position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.55);display:none}
  body.show-nav #scrim,body.show-aside #scrim{display:block}
  #fabs{display:flex}
  .grid2,.grid3,.refbox{grid-template-columns:minmax(0,1fr)}
  header{padding:10px 12px;gap:10px}
  .proj{display:none}
}
#fabs{display:flex;position:fixed;right:14px;bottom:16px;z-index:60;gap:8px}
@media (min-width:1001px){#fabs{display:none}}
#fabs .btn{box-shadow:0 6px 18px rgba(0,0,0,.5);background:var(--panel3)}
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="mark"><svg viewBox="0 0 24 24" fill="none"><path d="M5 4h4l3 10 3-10h4l-5 16h-4z" fill="#b87c46"/></svg></span>
    <div>
      <h1>痕域 · 角色配置台</h1>
      <p>角色卡 / 七槽技能 / 总表登记 —— 直接生成 .tres</p>
    </div>
  </div>
  <div class="hdr-tools">
    <label class="proj"><span>项目名</span><input id="projName" type="text" value="痕域" spellcheck="false"></label>
    <button class="btn" id="btnSample" title="填入一个示例角色，便于先看到完整输出">示例</button>
    <button class="btn" id="btnImport" title="导入此前导出的 .json 草稿">导入项目</button>
    <button class="btn" id="btnExport" title="把当前填写的所有角色存成 .json，便于以后继续编辑">导出项目</button>
    <button class="btn primary" id="btnGen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 19h14"/></svg>
      生成并下载
    </button>
  </div>
</header>
<div class="work">
  <nav id="nav"></nav>
  <main id="main"></main>
  <aside id="aside"></aside>
</div>
<div id="scrim"></div>
<div id="fabs">
  <button class="btn mini" data-act="toggle-nav">角色</button>
  <button class="btn mini" data-act="toggle-aside">输出</button>
</div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
<script>
'use strict';
/* ============================================================
   痕域 · 角色配置台
   单文件离线工具：填写 → 校验 → 生成 Godot .tres → 打包下载
   ============================================================ */

/* ---------- 常量：枚举与默认路径 ---------- */
const FATE_LIST  = ['沉刻','烬残','溯洄','续痕','破晓','妄溯','忆守庭'];
const CLASS_LIST = ['冕荒者','猎迹者','烬谛者','追刃者','御骸者','傀儡守卫','碎界者'];
const TRIGGER_LIST = ['战斗开始','回合开始','行动后','受击后','击杀后','暴击后','交锋胜利','任意时机'];

/* 英文变量名 → 中文字段名的同义词表（导入参考 .tres 时兜底） */
const SYN = {
  id:['唯一编号'], uuid:['唯一编号'], key:['唯一编号'], char_id:['唯一编号'],
  name:['卡牌名称','名称','被动名称','技能名称','回响名称','终结技名称','普攻名称'], card_name:['卡牌名称'], title:['卡牌名称'],
  cost:['购买费用'], price:['购买费用'], buy_cost:['购买费用'],
  fate:['命途'], path:['命途'],
  job:['职业'], cls:['职业'], class:['职业'], profession:['职业'],
  faction:['羁绊阵营'], camp:['羁绊阵营'], bond_faction:['羁绊阵营'],
  job1:['羁绊职业一'], bond_job1:['羁绊职业一'], job2:['羁绊职业二'], bond_job2:['羁绊职业二'],
  clash:['基础交锋值'], clash_value:['基础交锋值'],
  hp:['生命'], health:['生命'], max_hp:['生命'],
  atk:['攻击'], attack:['攻击'], def:['防御'], defense:['防御'],
  spd:['速度'], speed:['速度'],
  crit:['暴击率'], crit_rate:['暴击率'], crit_dmg:['暴伤'], crit_damage:['暴伤'],
  hit:['效果命中'], effect_hit:['效果命中'], res:['抵抗'], resist:['抵抗'],
  er:['能量回复效率'], energy_regen:['能量回复效率'], energy_max:['能量上限'], max_energy:['能量上限'],
  desc:['描述'], description:['描述'], text:['描述'],
  ratio:['伤害倍率','倍率'], multiplier:['伤害倍率','倍率'], damage_ratio:['伤害倍率'], power:['伤害倍率','倍率'],
  hits:['段数'], times:['段数'], count:['段数'],
  trigger:['触发条件','触发时机'], timing:['触发时机'], when:['触发时机'],
  energy:['能量消耗'], energy_cost:['能量消耗'],
  deathrattle:['机制名称'], death_rattle:['机制名称'], on_death:['机制名称'], mech:['机制名称'], mechanic:['机制名称'],
  mech_name:['机制名称'], mechanic_name:['机制名称'],
  condition:['触发条件'], trigger_condition:['触发条件'], cond:['触发条件'],
  effect:['触发后效果','效果说明'], mech_effect:['效果说明'], effect_text:['效果说明'],
  '亡语':['机制名称'], '死亡触发':['机制名称'], '机制':['机制名称'], '效果':['效果说明','触发后效果']
};

const SLOT_DEF = {
  passive:    { label:'被动',     sk:'passive', cls:'被动技能数据', path:'res://脚本文件/数据脚本/被动技能数据.gd' },

function hydrate(s){
  const d = defaultState();
  if(!s || typeof s !== 'object') return d;
  const out = Object.assign(d, s);
  // 旧草稿迁移：早期版本默认套一层文件夹、文件名带角色前缀、附两个说明文本
  if(!s.v){
    out.fileWithChar = false;
    out.zipWrap = false;
    out.withDocs = false;
  }
  out.v = 3;
  out.scripts = Object.assign(defaultScripts(), s.scripts||{});
  // 逐个补齐 schema（旧草稿 / 手改过的字段结构都要能对上）
  const ds = defaultSchemas();
  out.schemas = out.schemas || {};
  // 旧草稿里三个战技槽共用一份映射：拆开时沿用已改好的属性名
  ['skillPlus','skillElite'].forEach(k=>{
    const src = out.schemas['skill'];
    if(Array.isArray(src) && src.length && (!Array.isArray(out.schemas[k]) || !out.schemas[k].length)){
      out.schemas[k] = JSON.parse(JSON.stringify(src));
    }
  });
  for(const k in ds){
    const cur = out.schemas[k];
    if(!Array.isArray(cur) || !cur.length){ out.schemas[k] = ds[k]; continue; }
    cur.forEach(f=>{ if(f && typeof f.on !== 'boolean') f.on = true; if(f && !f.prop) f.prop = f.label; });
    // 缺字段就补上（按 key 对齐，保留用户改过的属性名）
    ds[k].forEach(df=>{ if(!cur.some(f=>f.key===df.key)) cur.push(df); });
  }
  out.chars = Array.isArray(out.chars) ? out.chars.filter(c=>c && c.card) : [];
  out.chars.forEach(c=>{
    if(!KIND_DEF[c.kind]) c.kind = 'char';
    c.skills = c.skills || {};
    KIND_DEF[c.kind].slots.forEach(k=>{ c.skills[k] = c.skills[k] || {}; });
  });
  out.sel = Math.min(Math.max(0, out.sel|0), Math.max(0, out.chars.length-1));
  return out;
}

/* ============================================================
   一、.tres 文本生成
   ============================================================ */
function qs(s){
  return '"' + String(s)
    .replace(/\\/g,'\\\\')
    .replace(/"/g,'\\"')
    .replace(/\r\n|\r|\n/g,'\\n')
    .replace(/\t/g,'\\t') + '"';
}
function numStr(v, mode){
  const n = Number(v);
  if(!isFinite(n)) return mode==='int' ? '0' : '0.0';
  if(mode==='int') return String(Math.round(n));
  return Number.isInteger(n) ? n + '.0' : String(n);
}
function safeName(s){
  let t = String(s||'').trim().replace(/[\\/:*?"<>|\r\n\t]/g,'_').replace(/\s+/g,'');
  return t.slice(0,40) || '未命名角色';
}
function formatValue(f, v){
  switch(f.type){
    case 'int':   return numStr(v,'int');
    case 'float': return numStr(v,'float');
    case 'bool':  return (v==='true'||v==='1'||v===true) ? 'true' : 'false';
    case 'enum': {
      if(state.enumAsIndex && Array.isArray(f.list) && f.list.length){
        const i = f.list.indexOf(String(v));
        if(i >= 0) return String(i);
      }
      return qs(v);
    }
    default: return qs(v);
  }
}
function collectProps(schema, obj, refs){
  const out = [];
  for(const f of schema){
    if(!f.on) continue;
    if(f.type === 'resource'){
      const r = (refs||[]).find(x=>x.slot===f.slot);
      if(r) out.push([f.prop, 'ExtResource("' + r.id + '")']);
      continue;
    }
    const raw = obj[f.key];
    const sv = (raw===undefined || raw===null) ? '' : String(raw).trim();
    if(sv === ''){
      if(!f.req && state.omitEmpty !== false) continue;
      if(f.type==='string'||f.type==='text'||f.type==='enum') out.push([f.prop, qs('')]);
      else out.push([f.prop, f.type==='int' ? '0' : '0.0']);
      continue;
    }
    out.push([f.prop, formatValue(f, sv)]);
  }
  return out;
}
function buildFile(opts){
  const cls = state.writeScriptClass === false ? '' : (opts.cls||'').trim();
  const path = (opts.path||'').trim();
  const exts = [];
  if(path) exts.push({type:'Script', path:path, id:'1_script'});
  (opts.refs||[]).forEach(r=>exts.push({type:'Resource', path:r.path, id:r.id}));
  const load = exts.length + 1;
  const head = cls
    ? '[gd_resource type="Resource" script_class="' + cls + '" load_steps=' + load + ' format=3]'
    : '[gd_resource type="Resource" load_steps=' + load + ' format=3]';
  const lines = [head, ''];
  exts.forEach(e=>lines.push('[ext_resource type="' + e.type + '" path="' + e.path + '" id="' + e.id + '"]'));
  if(exts.length) lines.push('');
  lines.push('[resource]');
  if(path) lines.push('script = ExtResource("1_script")');
  (opts.props||[]).forEach(p=>lines.push(p[0] + ' = ' + p[1]));
  return lines.join('\n') + '\n';
}

/* 生成单个实体的全部文件：1 张卡 + 对应槽位的技能资源 */
function buildEntityFiles(ch){
  const kd = KIND_DEF[ch.kind] || KIND_DEF.char;
  const nm = String(ch.card.name||'').trim();
  const cn = nm ? safeName(nm) : ('未命名_' + String(ch.uid||'0000').slice(-4));
  const sdir = (state[kd.skillDir] || state.skillDir) + '/' + cn;
  const refs = [];
  const files = [];

  kd.slots.forEach(slotKey=>{
    const d = SLOT_DEF[slotKey];
    const sc = state.schemas[d.sk] || [];
    const obj = ch.skills[slotKey] || {};
    const s = state.scripts[slotKey] || { cls:d.cls, path:d.path };
    const fn = slotFileName(cn, slotKey);
    const resPath = 'res://' + sdir + '/' + fn;
    files.push({
      path: sdir + '/' + fn,
      text: buildFile({ cls:s.cls, path:s.path, refs:[], props: collectProps(sc, obj, []) }),
      kind: 'skill', slot: slotKey
    });
    refs.push({ id: '2_' + slotKey.toLowerCase(), path: resPath, slot: slotKey });
  });

  const c = state.scripts[kd.cardScript] || { cls:'', path:'' };
  const cardFile = cn + '.tres';
  const cardRel = (state[kd.cardDir] || state.charDir) + '/' + cardFile;
  const cardPath = 'res://' + cardRel;
  files.unshift({
    path: cardRel,
    text: buildFile({ cls:c.cls, path:c.path, refs:refs, props: collectProps(state.schemas[kd.cardSk], ch.card, refs) }),
    kind: 'card'
  });
  return { files: files, cardPath: cardPath, cn: cn, kind: ch.kind };
}
function buildCharFiles(ch){ return buildEntityFiles(ch); }

/* 全项目的文件清单（含总表 / 说明） */
function buildAll(){
  if(!state.chars.length) return { files: [], cards: [], chars: [] };
  const all = [];
  const cards = [];
  const chars = [];
  const byKind = { char: [], mob: [], boss: [] };
  state.chars.forEach((ch, i)=>{
    const built = buildEntityFiles(ch);
    all.push.apply(all, built.files);
    const item = { path: built.cardPath, name: safeName(ch.card.name), files: built.files, kind: ch.kind };
    if(state.totalAll || ch.kind === 'char') cards.push(item);
    byKind[ch.kind || 'char'].push(item);
    chars.push(built);
  });

  // 设定速查（始终随包）
  all.push({ path: '设定一览.txt', text: settingsText(), kind:'doc' });

  const snippet = totalSnippet(cards);
  if(state.withDocs) all.push({ path: '角色总配置表_追加片段.txt', text: snippet, kind:'doc' });

  if(state.totalMerge && state.totalExisting.trim()){
    try{
      const merged = mergeTotal(state.totalExisting, cards);
      all.push({ path: '角色总配置表.tres', text: merged.text, kind:'doc' });
    }catch(err){
      all.push({ path: '角色总配置表_合并失败.txt', text: '合并失败：' + err.message + '\n', kind:'doc' });
    }
  }
  if(state.withDocs) all.push({ path: '导入说明.txt', text: readmeText(cards), kind:'doc' });
  return { files: all, cards: cards, chars: chars, byKind: byKind };
}

function wrapBlock(text, max, indent){

  String(text||'').split(/\r?\n/).forEach(para=>{

      const c = arr[i];
      const keep = /[，。、；：！？）」』】》%…·]/.test(c) || (/\d/.test(c) && /\d/.test(cur.slice(-1)));
      if(cur && !keep && vlen(cur) + vlen(c) > max){ out.push(indent + cur.replace(/\s+$/, '')); cur = ''; }
      cur += c;
    }
    out.push(indent + cur.replace(/\s+$/, ''));
  });
  return out;
}
function schField(group, key){ return (state.schemas[group]||[]).find(f=>f.key===key); }
function schLabel(group, key, fallback){
  const f = schField(group, key);
  return f ? f.label : (fallback || key);
}
function kvValue(group, obj, key){
  const f = schField(group, key);
  if(f && f.on === false) return '';
  const raw = obj[key];
  const s = (raw===undefined || raw===null) ? '' : String(raw).trim();
  if(!s) return '';
  const label = f ? f.label : key;
  if(/率|暴伤|效率|命中|抵抗|抗性/.test(label)){
    const n = Number(s);
    if(isFinite(n) && n > 0 && n <= 2) return s + '（' + (Math.round(n * 1000) / 10) + '%）';
  }
  return s;
}
function kv(group, obj, key){
  const v = kvValue(group, obj, key);
  if(!v) return '';
  return schLabel(group, key) + ' ' + v;
}

function shortId(str){
  let h = 0;
  for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) >>> 0; }
  return ('000000' + h.toString(36)).slice(-6);
}

/* ============================================================
   二、总配置表合并（文本手术，尽量不动用户原有内容）
   ============================================================ */
function mergeTotal(text, cards){
  let src = String(text||'').replace(/\r\n/g,'\n');
  if(!/\[gd_resource/.test(src)) throw new Error('缺少 [gd_resource] 文件头，确认粘贴的是 .tres 原文');
  const warns = [];
  const lines = src.split('\n');

  let lastExt = -1, firstSub = -1, firstRes = -1;
  lines.forEach((l,i)=>{
    if(/^\[ext_resource/.test(l)) lastExt = i;
    if(/^\[sub_resource/.test(l) && firstSub < 0) firstSub = i;
    if(/^\[resource\]/.test(l) && firstRes < 0) firstRes = i;
  });
  if(firstRes < 0) throw new Error('找不到 [resource] 段');

  // 现有 ext id 的编号，避免撞号
  let maxN = 0;
  (src.match(/^\[ext_resource[\s\S]*?id="([0-9]+)_/gm) || []).forEach(m=>{
    const n = parseInt(m.replace(/[\s\S]*id="([0-9]+)_/,'$1'), 10);
    if(isFinite(n) && n > maxN) maxN = n;
  });
  const existingPaths = new Set((src.match(/^\[ext_resource[^\n]*path="([^"]+)"/gm)||[])
    .map(l=>l.replace(/[\s\S]*path="([^"]+)"/,'$1')));

  const add = [];
  cards.forEach(c=>{
    if(existingPaths.has(c.path)){ warns.push('总表已包含，跳过：' + c.path); return; }
    add.push(c);
  });

  if(add.length){
    const baseN = Math.max(maxN + 1, 2);
    const extLines = add.map((c,i)=>'[ext_resource type="Resource" path="' + c.path + '" id="' + (baseN + i) + '_' + shortId(c.path) + '"]');
    const at = lastExt >= 0 ? lastExt + 1 : (firstSub >= 0 ? firstSub : firstRes);
    lines.splice(at, 0, ...extLines);

    // 重新定位 [resource]（上面可能插入了行）
    let resIdx = -1;
    lines.forEach((l,i)=>{ if(/^\[resource\]/.test(l) && resIdx < 0) resIdx = i; });
    const propName = state.totalProp || '所有角色';
    let propIdx = -1;
    for(let i=resIdx;i<lines.length;i++){
      if(lines[i].indexOf(propName) === 0 && lines[i].indexOf('=') > 0){ propIdx = i; break; }
      if(i > resIdx && /^\[/.test(lines[i])) break;
    }
    if(propIdx < 0) throw new Error('在 [resource] 段里找不到属性 ' + propName);

    const head = lines.slice(0, propIdx).join('\n');
    const restAll = lines.slice(propIdx).join('\n');
    const eq = restAll.indexOf('=');
    let pos = eq;
    if(/Array\[/.test(restAll.slice(eq, eq + 40))){ pos = restAll.indexOf(']', eq) + 1; }
    const lb = restAll.indexOf('[', pos);
    if(lb < 0) throw new Error('属性 ' + propName + ' 的值不是数组，无法追加');
    let depth = 0, end = -1;
    for(let i=lb;i<restAll.length;i++){
      if(restAll[i] === '[') depth++;
      else if(restAll[i] === ']'){ depth--; if(depth === 0){ end = i; break; } }
    }
    if(end < 0) throw new Error('数组没有闭合，文本可能不完整');

    const tag = [];
    add.forEach((c,i)=>{
      tag.push('ExtResource("' + (baseN + i) + '_' + shortId(c.path) + '")');
    });
    const inner = restAll.slice(lb + 1, end).replace(/\s+$/,'');
    const newInner = inner
      ? inner + ',\n' + tag.join(',\n') + '\n'
      : '\n' + tag.join(',\n') + '\n';
    const tail = restAll.slice(end + 1);
    src = head + '\n' + restAll.slice(0, lb + 1) + newInner + ']' + tail;
    if(src[src.length-1] !== '\n') src += '\n';
  }

  // 修 load_steps
  const extCount = (src.match(/^\[ext_resource/gm)||[]).length;
  const subCount = (src.match(/^\[sub_resource/gm)||[]).length;
  const load = extCount + subCount + 1;
  if(/load_steps=\d+/.test(src)){
    src = src.replace(/load_steps=\d+/, 'load_steps=' + load);
  }else{
    src = src.replace('[gd_resource', '[gd_resource load_steps=' + load);
  }
  return { text: src, warns: warns, added: add.map(c=>c.path) };
}

/* ============================================================
   三、校验
   ============================================================ */
function validateAll(){
  const issues = [];
  const push = (lv, msg, who)=>{ issues.push({ lv: lv, msg: msg, who: who||'' }); };
  const ids = {};
  const cardPaths = {};
  const extra = (state.existingIds||'').split(/[\s,，、;；]+/).filter(Boolean);

  state.chars.forEach((ch, i)=>{
    const kind = ch.kind || 'char';
    const kd = KIND_DEF[kind];
    const who = (ch.card.name || ('第 ' + (i+1) + ' 个' + kd.one));
    const id = String(ch.card.id||'').trim();
    const cpath = (state[kd.cardDir] || '') + '/' + safeName(ch.card.name) + '.tres';
    if(cardPaths[cpath]) push('err', kd.label + '名称重复，生成路径会互相覆盖：' + cpath, who);
    else cardPaths[cpath] = true;
    if(!ch.card.name || !String(ch.card.name).trim()) push('err','名称未填', who);
    if(!id) push('err','唯一编号未填', who);
    else if(/[\/\\\s]/.test(id)) push('err','唯一编号不能含空格或斜杠：' + id, who);
    else if(ids[id]) push('err','唯一编号重复：' + id, who);
    else { ids[id] = true; if(extra.indexOf(id) >= 0) push('warn','该编号已存在于「已有编号」清单：' + id, who); }

    if(kind === 'char'){
      const cost = Number(ch.card.cost);
      if(!isFinite(cost) || cost < 1 || cost > 5) push('err','购买费用必须是 1–5（当前：' + (ch.card.cost||'空') + '）', who);
      if(!String(ch.card.fate||'').trim()) push('err','命途未选', who);
      if(!String(ch.card.class||'').trim()) push('err','职业未选', who);
    }

    const kdSchema = state.schemas[kd.cardSk] || [];
    ['hp','atk','def','spd'].forEach(k=>{
      const f = kdSchema.find(x=>x.key===k);
      if(f && f.on && String(ch.card[k]||'').trim()==='') push('warn','数值留空：' + f.label, who);
    });
    // 机制写了名称却没写效果
    if(kind !== 'char'){
      [['mechName','mechEffect'],['mech2Name','mech2Effect']].forEach(([kn,ke])=>{
        if(String(ch.card[kn]||'').trim() && !String(ch.card[ke]||'').trim())
          push('warn','机制「' + ch.card[kn] + '」没写效果说明', who);
      });
    }

    kd.slots.forEach(k=>{
      const d = SLOT_DEF[k];
      const sc = state.schemas[d.sk] || [];
      const obj = ch.skills[k] || {};
      // 必填项统一检查（名称、倍率、段数…）
      sc.forEach(f=>{
        if(f.on && f.req && f.type !== 'resource' && String(obj[f.key]===undefined?'':obj[f.key]).trim()===''){
          push('err', d.label + '的「' + f.label + '」未填', who);
        }
      });
      const rf = sc.find(f=>f.key==='ratio');
      if(rf && rf.on && String(obj.ratio||'').trim()!==''){
        const n = Number(obj.ratio);
        if(!isFinite(n) || n <= 0) push('warn', d.label + '倍率不合法：' + obj.ratio, who);
      }
      const hf = sc.find(f=>f.key==='hits');
      if(hf && hf.on && String(obj.hits||'').trim()!==''){
        const n = Number(obj.hits);
        if(!isFinite(n) || n < 1) push('err', d.label + '段数需 ≥ 1', who);
      }
      // 属性名重复
      const props = collectProps(sc, obj, []);
      const seen = {};
      props.forEach(p=>{ if(seen[p[0]]) push('err', d.label + ' 属性名重复：' + p[0] + '（字段映射里改名）', who); seen[p[0]] = true; });
      if(sc.some(f=>f.on && !String(f.prop||'').trim())) push('err', d.label + ' 有字段属性名为空', who);
    });

    const cp = collectProps(kdSchema, ch.card, []);
    const cseen = {};
    cp.forEach(p=>{ if(cseen[p[0]]) push('err', kd.one + '卡属性名重复：' + p[0], who); cseen[p[0]] = true; });
  });

  // 脚本路径
  const sp = state.scripts;
  Object.keys(sp).forEach(k=>{
    const p = String(sp[k].path||'').trim();
    const label = k==='card' ? '角色卡' : (k==='mobCard' ? '怪物卡' : (k==='bossCard' ? 'BOSS卡' : SLOT_DEF[k].label));
    if(!p) push('err', label + '的脚本路径为空', '');
    else if(!/^res:\/\//.test(p)) push('warn', label + ' 脚本路径应以 res:// 开头', '');
    else if(!/\.gd$/.test(p)) push('warn', label + ' 脚本路径不是 .gd', '');
    if(!String(sp[k].cls||'').trim()) push('warn', label + ' 的 script_class 为空（生成的资源在编辑器里会显示为普通 Resource）', '');
  });

  if(state.totalMerge){
    if(!state.totalExisting.trim()) push('warn','已开启总表合并，但没粘贴现有总配置表内容','');
    else {
      try{
        const r = mergeTotal(state.totalExisting, buildAll().cards);
        r.warns.forEach(w=>push('warn', w, ''));
        if(!r.added.length) push('warn','所有角色都已在总表里，合并后没有新增','');
      }catch(err){ push('err','总表合并失败：' + err.message, ''); }
    }
  }
  return issues;
}

/* ============================================================
   四、ZIP（store 模式，无第三方库）
   ============================================================ */
const CRC_TABLE = (function(){
  const t = new Uint32Array(256);
  for(let n=0;n<256;n++){
    let c = n;
    for(let k=0;k<8;k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(u8){
  let c = 0xFFFFFFFF;
  for(let i=0;i<u8.length;i++) c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function makeZip(files, rootName){
  const enc = new TextEncoder();
  const parts = [], central = [];
  let offset = 0;
  const now = new Date();
  const dosT = ((now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1)) & 0xFFFF;
  const dosD = (((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate()) & 0xFFFF;
  const list = rootName ? files.map(f=>({ path: rootName + '/' + f.path, text: f.text })) : files;
  list.forEach(f=>{
    const data = enc.encode(f.text);
    const nb = enc.encode(f.path);
    const crc = crc32(data);
    const lh = new Uint8Array(30 + nb.length);
    const dv = new DataView(lh.buffer);
    dv.setUint32(0, 0x04034b50, true);
    dv.setUint16(4, 20, true);
    dv.setUint16(6, 0x0800, true);      // UTF-8 文件名
    dv.setUint16(8, 0, true);           // store
    dv.setUint16(10, dosT, true);
    dv.setUint16(12, dosD, true);
    dv.setUint32(14, crc, true);
    dv.setUint32(18, data.length, true);
    dv.setUint32(22, data.length, true);
    dv.setUint16(26, nb.length, true);
    dv.setUint16(28, 0, true);
    lh.set(nb, 30);
    parts.push(lh, data);
    central.push({ nb: nb, crc: crc, size: data.length, off: offset });
    offset += lh.length + data.length;
  });
  let cdLen = 0;
  const cd = [];
  central.forEach(c=>{
    const b = new Uint8Array(46 + c.nb.length);
    const dv = new DataView(b.buffer);
    dv.setUint32(0, 0x02014b50, true);
    dv.setUint16(4, 20, true);
    dv.setUint16(6, 20, true);
    dv.setUint16(8, 0x0800, true);
    dv.setUint16(10, 0, true);
    dv.setUint16(12, dosT, true);
    dv.setUint16(14, dosD, true);
    dv.setUint32(16, c.crc, true);
    dv.setUint32(20, c.size, true);
    dv.setUint32(24, c.size, true);
    dv.setUint16(28, c.nb.length, true);
    dv.setUint16(30, 0, true);
    dv.setUint16(32, 0, true);
    dv.setUint16(34, 0, true);
    dv.setUint16(36, 0, true);
    dv.setUint32(38, 0, true);
    dv.setUint32(42, c.off, true);
    b.set(c.nb, 46);
    cd.push(b);
    cdLen += b.length;
  });
  const eocd = new Uint8Array(22);
  const dv = new DataView(eocd.buffer);
  dv.setUint32(0, 0x06054b50, true);
  dv.setUint16(4, 0, true);
  dv.setUint16(6, 0, true);
  dv.setUint16(8, central.length, true);
  dv.setUint16(10, central.length, true);
  dv.setUint32(12, cdLen, true);
  dv.setUint32(16, offset, true);
  dv.setUint16(20, 0, true);
  return new Blob(parts.concat(cd, [eocd]), { type: 'application/zip' });
}

function fieldHTML(f, obj, prefix){
  if(f.on === false){
    return '<div class="fld"><label>' + esc(f.label) + '<span class="ty">停用</span></label>'
      + '<div class="fh">不写入 .tres，需要时在「字段映射」里启用' + (f.hint ? ' · ' + esc(f.hint) : '') + '</div></div>';
  }
  const v = (obj[f.key]===undefined || obj[f.key]===null) ? '' : String(obj[f.key]);
  const p = prefix + ':' + f.key;
  const bad = (f.req && v.trim()==='') ? ' bad' : '';
  let ctl = '';
  if(f.type === 'enum'){
    const dl = 'dl_' + Math.random().toString(36).slice(2,8);
    ctl = '<input type="text" list="' + dl + '" value="' + esc(v) + '" data-path="' + p + '" placeholder="' + esc(f.ph||'') + '" spellcheck="false">'
        + '<datalist id="' + dl + '">' + (f.list||[]).map(o=>'<option value="' + esc(o) + '">').join('') + '</datalist>';
  }else if(f.type === 'text'){
    ctl = '<textarea rows="3" data-path="' + p + '" placeholder="' + esc(f.ph||'') + '">' + esc(v) + '</textarea>';
  }else if(f.type === 'int' || f.type === 'float'){
    ctl = '<input type="number" step="' + (f.type==='int'?'1':'any') + '" value="' + esc(v) + '" data-path="' + p + '" placeholder="' + esc(f.ph||'') + '">';
  }else if(f.type === 'resource'){
    return '';
  }else{
    ctl = '<input type="text" value="' + esc(v) + '" data-path="' + p + '" placeholder="' + esc(f.ph||'') + '" spellcheck="false">';
  }
  return '<div class="fld' + bad + '"><label>' + esc(f.label) + (f.req?'<span class="rq">*</span>':'')
       + '<span class="ty">' + (f.type==='text'?'str':f.type) + '</span></label>' + ctl
       + (f.hint ? '<span class="fh">' + esc(f.hint) + '</span>' : '') + '</div>';
}
function sectionHTML(sec, schema, obj, prefix){
  const fields = sec.keys.map(k=>schema.find(f=>f.key===k)).filter(Boolean);

       + '<span class="hint">' + esc(sec.hint) + '</span></div><div class="sec-bd"><div class="' + sec.cols + '">'
       + fields.map(f=>fieldHTML(f, obj, prefix)).join('') + '</div></div></div>';
}

function entitySub(c){
  const kind = c.kind || 'char';
  if(kind === 'char') return [c.card.id, c.card.fate, c.card.class, c.card.cost ? '费用 ' + c.card.cost : ''].filter(Boolean).join('  ·  ');
  return [c.card.id, c.card.hp ? '生命 ' + c.card.hp : '', c.card.atk ? '攻击 ' + c.card.atk : '',
          c.card.spd ? '速度 ' + c.card.spd : '', c.card.mechName || ''].filter(Boolean).join('  ·  ');
}

function syncLive(){
  const cur = state.chars[state.sel];
  if(!cur) return;
  const kd = KIND_DEF[cur.kind || 'char'];
  const nm = String(cur.card.name||'').trim();
  const cn = nm ? safeName(cur.card.name) : ('未命名_' + String(cur.uid||'0000').slice(-4));
  document.querySelectorAll('[data-rel]').forEach(el=>{
    const rel = (state[kd.skillDir] || '') + '/' + cn + '/' + slotFileName(cn, el.dataset.rel);
    el.textContent = el.classList.contains('rp') ? rel : ('res://' + rel);
  });
  const nameEl = document.querySelector('[data-head="name"]');
  if(nameEl) nameEl.textContent = cur.card.name || ('未命名' + kd.one);
  const subEl = document.querySelector('[data-head="sub"]');
  if(subEl) subEl.textContent = entitySub(cur) || '尚未填写';
}
function entityOf(view){
  const list = state.chars;
  let cur = list[state.sel];
  if(cur && (cur.kind || 'char') === view) return cur;
  const idx = list.findIndex(c=>(c.kind || 'char') === view);
  if(idx >= 0){ state.sel = idx; return list[idx]; }
  return null;

function highlight(text){
  return text.split('\n').map(l=>{
    if(/^\[/.test(l)) return '<span class="k">' + esc(l) + '</span>';
    const i = l.indexOf(' = ');
    if(i > 0){
      const rhs = l.slice(i + 3);
      let cls = 'n';
      if(/^"/.test(rhs)) cls = 's';
      else if(/^ExtResource/.test(rhs)) cls = 'k';
      return esc(l.slice(0, i)) + ' <span class="c">=</span> <span class="' + cls + '">' + esc(rhs) + '</span>';
    }
    return esc(l);
  }).join('\n');
}

function toast(msg){
  const t = $('#toast') || (function(){
    const d = document.createElement('div');
    d.id = 'toast';
    d.style.cssText = 'position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:90;'
      + 'padding:9px 16px;background:#1d222a;border:1px solid #3a4450;border-radius:3px;'
      + 'font-size:12.5px;color:#e3e6ea;box-shadow:0 8px 24px rgba(0,0,0,.45);opacity:0;transition:opacity .2s;pointer-events:none;max-width:80vw';
    document.body.appendChild(d);
    return d;
  })();
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(t._h);
  t._h = setTimeout(()=>{ t.style.opacity = '0'; }, 2600);
}
function copyText(text, label){
  const done = ()=>toast((label||'已复制') + ' · ' + text.length + ' 字符');
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text, done));
  }else fallbackCopy(text, done);
}
function fallbackCopy(text, done){
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); done(); }catch(e){ toast('复制失败，请手动选中'); }
  document.body.removeChild(ta);
}
function download(name, blob){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1200);
}
function focusEntity(i){
  const c = state.chars[i];
  if(!c) return;
  state.sel = i;
  state.view = c.kind || 'char';
  const built = buildEntityFiles(c);
  state.previewPath = built.files[0] ? built.files[0].path : '';
  renderNav(); renderMain(); refresh();
  const m = $('#main'); if(m) m.scrollTop = 0;
}
function selectChar(i){ focusEntity(i); }
function addEntity(kind){
  const k = KIND_DEF[kind] ? kind : 'char';
  state.chars.push(newEntity(k));
  focusEntity(state.chars.length - 1);
  toast('已新建' + KIND_DEF[k].one + '，填写名称与编号');
}
function setPath(p, v){
  const seg = p.split(':');
  const c = state.chars[state.sel];
  if(!c) return;
  if(seg[0] === 'card') c.card[seg[1]] = v;
  else if(seg[0] === 'skills'){ c.skills[seg[1]] = c.skills[seg[1]] || {}; c.skills[seg[1]][seg[2]] = v; }
}
function downloadZip(onlyIndex){
  if(!state.chars.length){ toast('先新建角色 / 怪物 / BOSS，或点右上「示例」'); return; }
  const fileList = onlyIndex !== undefined
    ? (function(){
        const ch = state.chars[onlyIndex];
        const built = buildEntityFiles(ch);
        const cards = [{ path: built.cardPath, name: safeName(ch.card.name), files: built.files, kind: ch.kind || 'char' }];
        const fs = built.files.slice();
        fs.push({ path:'设定一览.txt', text: settingsText([ch]), kind:'doc' });
        if(state.withDocs){
          fs.push({ path:'角色总配置表_追加片段.txt', text: totalSnippet(cards), kind:'doc' });
          fs.push({ path:'导入说明.txt', text: readmeText(cards), kind:'doc' });
        }
        return { files: fs, cards };
      })()
    : buildAll();

  const errs = ISSUES.filter(i=>i.lv==='err').length;
  if(errs && !confirm('还有 ' + errs + ' 个错误（见右下角），仍要生成吗？')) return;
  const base = (state.project || '痕域') + '角色配置';
  const root = state.zipWrap ? base : null;
  const blob = makeZip(fileList.files, root);
  const name = base + (onlyIndex !== undefined ? '_' + fileList.cards[0].name : '') + '.zip';
  download(name, blob);
  toast('已生成 ' + fileList.files.length + ' 个文件 · ' + name);
}
async function writeToDir(){
  if(!window.showDirectoryPicker){ toast('当前浏览器不支持目录写入，请用 ZIP'); return; }
  try{
    const root = await showDirectoryPicker({ mode:'readwrite' });
    let n = 0;
    for(const f of MODEL.files){
      if(/_(追加片段|合并失败)\.txt$/.test(f.path) || f.path === '导入说明.txt') continue;
      const segs = f.path.split('/');
      let dir = root;
      for(let i=0;i<segs.length-1;i++) dir = await dir.getDirectoryHandle(segs[i], { create:true });
      const fh = await dir.getFileHandle(segs[segs.length-1], { create:true });
      const w = await fh.createWritable();
      await w.write(f.text); await w.close(); n++;
    }
    toast('已写入 ' + n + ' 个文件到所选目录');
  }catch(err){
    toast(err && err.name === 'SecurityError' ? '被浏览器拦下（file:// 不支持），请解压 ZIP' : ('写入失败：' + (err.message||err.name)));
  }
}

/* 事件代理 */
document.addEventListener('click', e=>{
  if(e.target.id === 'scrim'){ closeDrawers(); return; }
  const t = e.target.closest('[data-sel],[data-view],[data-act],[data-toggle],[data-file]');
  if(!t) return;

  if(t.dataset.sel !== undefined && !t.dataset.act){ selectChar(Number(t.dataset.sel)); closeDrawers(); return; }
  if(t.dataset.view){ state.view = t.dataset.view; renderNav(); renderMain(); refresh(); $('#main').scrollTop = 0; closeDrawers(); return; }

  if(t.dataset.toggle){
    const slot = t.closest('.slot');
    if(slot) slot.classList.toggle('closed');
    return;
  }
  if(t.dataset.file){
    state.previewPath = t.dataset.file;
    renderAside();
    return;
  }

  const act = t.dataset.act;
  if(!act) return;
  const c = state.chars[state.sel];
  switch(act){
    case 'add': addEntity(t.dataset.kind || 'char'); break;
    case 'copy-char':
      if(!c) break;
      state.chars.push(Object.assign(JSON.parse(JSON.stringify(c)), { uid:'c'+Date.now().toString(36) }));
      state.chars[state.chars.length-1].card.id = String(c.card.id||'') + '_copy';

      renderNav(); renderMain(); refresh(); toast('已复制，记得改唯一编号');
      break;
    case 'del-char':
      if(!c) break;
      if(!confirm('删除「' + (c.card.name||('未命名' + (KIND_DEF[c.kind||'char']).one)) + '」？')) break;
      state.chars.splice(state.sel, 1);
      state.sel = Math.max(0, Math.min(state.sel, state.chars.length-1));
      renderNav(); renderMain(); refresh(); toast('已删除');
      break;
    case 'export-one': downloadZip(state.sel); break;
    case 'zip': downloadZip(); break;
    case 'copy-file': {
      const f = MODEL.files.find(x=>x.path===state.previewPath) || MODEL.files[0];
      if(f) copyText(f.text, fileLabel(f));
      break;
    }
    case 'copy-merge': {
      try{ copyText(mergeTotal(state.totalExisting, buildAll().cards).text, '角色总配置表.tres'); }catch(err){ toast(err.message); }
      break;
    }

      const all = buildAll();
      copyText(totalSnippet((all.byKind ? all.byKind.mob.concat(all.byKind.boss) : []), '# 你的 怪物 / BOSS 总配置表.tres'), '怪物/BOSS 片段');
      break;

      if(!confirm('把字段映射恢复成默认（中文字段名）？')) break;
      state.schemas = defaultSchemas(); renderMain(); refresh(); toast('已恢复默认映射');
      break;
    case 'apply-ref': applyReference(); break;
    case 'sample': fillSample(); break;
    case 'write-dir': writeToDir(); break;
    case 'toggle-nav':
      closeDrawers();
      document.body.classList.add('show-nav');
      break;
    case 'toggle-aside':

      break;
  }
});

/* 参考 .tres 解析 */
function applyReference(){
  const text = ($('#refText') || {}).value || '';
  const group = ($('#refGroup') || {}).value || 'card';
  const log = $('#refLog');
  const show = (msg, ok)=>{
    state.refLast = { msg: msg, ok: !!ok };
    const box = $('#refLog');
    if(box){
      box.style.display = 'block';
      box.className = 'note ' + (ok ? '' : 'e');
      box.innerHTML = msg;
    }
  };
  if(!text.trim()){ show('先粘贴一段 .tres 原文。', false); return; }
  const head = text.match(/script_class="([^"]+)"/);
  const scriptPath = text.match(/\[ext_resource type="Script"[^\]]*path="([^"]+)"/);
  const body = text.split(/^\[resource\]\s*$/m)[1] || '';
  if(!body.trim()){ show('没找到 [resource] 段，确认粘贴的是 .tres 全文。', false); return; }

  const keys = [];
  body.split('\n').forEach(line=>{
    const m = line.match(/^\s*([^\s=][^=]*?)\s*=\s*(.*)$/);
    if(m && m[1] !== 'script') keys.push(m[1].trim());
  });

  const sc = state.schemas[group] || [];
  let hit = 0, bySyn = 0;
  const used = new Set();
  const unmatched = [];
  keys.forEach(k=>{
    const f = sc.find(x=>x.type !== 'resource' && !used.has(x.key) && (x.prop === k || x.label === k));
    if(f){ f.prop = k; used.add(f.key); hit++; }
    else unmatched.push(k);
  });
  // 英文变量名按常见同义词兜底匹配（id / hp / atk / crit_rate …）
  const left = [];
  unmatched.forEach(k=>{
    const nk = k.toLowerCase().replace(/\s/g,'');
    const cand = SYN[nk] || SYN[nk.replace(/_/g,'')] || [];
    let done = false;
    for(const lab of cand){
      const f = sc.find(x=>x.type !== 'resource' && !used.has(x.key) && x.label === lab);
      if(f){ f.prop = k; used.add(f.key); hit++; bySyn++; done = true; break; }
    }
    if(!done) left.push(k);
  });
  // 只有当参考字段数与剩余字段数完全一致时才按顺序对齐（导出顺序通常一致）
  if(left.length && hit < Math.min(keys.length, sc.length) * 0.5){
    const targets = sc.filter(f=>f.type !== 'resource' && !used.has(f.key));
    if(left.length === targets.length){
      targets.forEach((f,i)=>{ f.prop = left[i]; used.add(f.key); hit++; });
      left.length = 0;
    }
  }
  const cardGroups = { card:'card', mobCard:'mobCard', bossCard:'bossCard' };
  if(cardGroups[group]){
    const sk = cardGroups[group];
    if(head) state.scripts[sk].cls = head[1];
    if(scriptPath) state.scripts[sk].path = scriptPath[1];
  }else{
    if(head) ALL_SLOTS.forEach(k=>{ if(SLOT_DEF[k].sk === group) state.scripts[k].cls = head[1]; });
    if(scriptPath) ALL_SLOTS.forEach(k=>{ if(SLOT_DEF[k].sk === group) state.scripts[k].path = scriptPath[1]; });
  }

  show('识别到 ' + keys.length + ' 个属性：<br><span class="mono-sm">' + esc(keys.join(' · ')) + '</span><br>已对齐 '
    + hit + ' 个字段' + (bySyn ? '（其中 ' + bySyn + ' 个按英文同义词推断，建议核对）' : '')
    + (left.length ? '<br>未匹配，请手动改名：' + esc(left.join(' · ')) : '')
    + '<br>script_class：' + esc(head ? head[1] : '—') + '　脚本：' + esc(scriptPath ? scriptPath[1] : '—'), true);
  renderMain(); refresh();
  toast('字段映射已按参考文件对齐');
}
